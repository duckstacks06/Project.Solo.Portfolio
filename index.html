<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/styles.css" rel="stylesheet" />
    <title>Roa Portfolio</title>
</head>
<body>
    <section class="sky">
        <button class="sun" data-speed="20">
            <div class="rays">
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
            </div>
            <span>view</span>
        </button>
        
    </section>

    <section class="surface" id="surface">
        <div class="box-wrapper" data-reveal>
            <div class="test-box1" data-speed="20"></div>
        </div>
        <div class="test-box2" data-speed="10"></div>
        <div class="text" data-reveal>
            <h1 data-speed="50">Welcome to my Portfolio</h1>
        </div>
    </section>

    <section class="underwater">
        <nav class="tab-navbar">
            <button class="tab-btn active" data-tab="youtube">YouTube</button>
            <button class="tab-btn" data-tab="music">Music</button>
            <button class="tab-btn" data-tab="coding">Coding</button>
        </nav>

        <div class="tab-container">
        <!-- YouTube (Visible by default) -->
        <div class="tab-panel" id="youtube">
            <h2>My YouTube Content</h2>
            <p>Videos and content streaming analytics...</p>
        </div>

        <!-- Music -->
        <div class="tab-panel hidden" id="music">
            <h2>My Music Portfolio</h2>
            <p>Tracks, beats, and audio production...</p>
        </div>

        <!-- Coding -->
        <div class="tab-panel hidden" id="coding">
            <h2>Coding Skills</h2>
            <p>Codebases, components, and project repositories...</p>
        </div>
    </div>
    </section>
    
    <script src="js/gsap.min.js"></script>
    <script src="js/ScrollTrigger.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
